<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening Using NLP</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .container{

            width:500px;
            background:white;
            border-radius:15px;
            padding:40px;
            text-align:center;
            box-shadow:0 15px 30px rgba(0,0,0,0.2);

        }

        h1{

            color:#1e3a8a;
            margin-bottom:10px;

        }

        p{

            color:#555;
            margin-bottom:30px;

        }

        .upload-box{

            border:2px dashed #1e3a8a;
            border-radius:10px;
            padding:35px;
            cursor:pointer;
            transition:.3s;

        }

        .upload-box:hover{

            background:#f3f7ff;

        }

        .upload-box img{

            width:70px;
            margin-bottom:15px;

        }

        .upload-box h3{

            color:#1e3a8a;

        }

        input[type=file]{

            display:none;

        }

        #file-name{

            margin-top:15px;
            color:#333;
            font-size:14px;

        }

        button{

            margin-top:30px;
            width:100%;
            padding:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Resume Screening</h1>

<p>
Upload your resume to predict the most suitable job role using NLP & Machine Learning.
</p>

<form action="http://127.0.0.1:5000/predict" method="POST" enctype="multipart/form-data">

<label class="upload-box">

<img src="https://cdn-icons-png.flaticon.com/512/337/337946.png">

<h3>Click to Upload Resume</h3>

<p>PDF or DOCX</p>

<input
type="file"
name="resume"
accept=".pdf,.doc,.docx"
required
onchange="showFileName(this)">

</label>

<p id="file-name"></p>

<button type="submit">

Analyze Resume

</button>

</form>

</div>

<script>

function showFileName(input){

    if(input.files.length>0){

        document.getElementById("file-name").innerHTML=
        "Selected File : <b>"+input.files[0].name+"</b>";

    }

}

</script>

</body>

</html>
